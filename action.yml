name: mdu
description: Render Markdown documentation with MDU and deploy it to GitHub Pages.

inputs:
  docs-path:
    description: Folder containing Markdown documentation.
    required: false
    default: docs
  output-path:
    description: Folder for the generated site.
    required: false
    default: site
  edit-page-root:
    description: Optional URL to the repository folder where the Markdown files can be edited.
    required: false
    default: ''
  mdu-version:
    description: MDU Docker image tag to use.
    required: false
    default: '5.1.0'

outputs:
  page_url:
    description: URL of the deployed GitHub Pages site.
    value: ${{ steps.deploy.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Render documentation
      run: bash "$ACTION_PATH/scripts/render.sh"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DOCS_PATH: ${{ inputs.docs-path }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        EDIT_PAGE_ROOT: ${{ inputs.edit-page-root }}
        MDU_VERSION: ${{ inputs.mdu-version }}

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v6

    - name: Upload site artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ inputs.output-path }}

    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v5
